[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "build.buy"
version = "0.1.0"
description = "Compare build and buy options for an AI capability: NPV, payback, growing run costs, delayed benefits, and the year the cost curves cross. Dependency-free Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AndMaverick LLC" }]

[tool.setuptools.packages.find]
include = ["build_buy*"]
